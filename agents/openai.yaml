interface:
  display_name: "Shopify 优化上新"
  short_description: "固定集合映射、首图与 SKC 顺序校验的 Shopify 上新"
  default_prompt: "使用 $shopify-optimize-launch 按已验证的两店集合映射优化并拆分上新文件；仅在配置变化触发时刷新后台规则。使用整数售价、清空划线价，校验集合标签、定价、首图、图片位置与 SKC 颜色顺序，然后生成可导入的 Shopify CSV。遇到没有已批准价格的新产品类型时，直接询问用户。"

policy:
  allow_implicit_invocation: true
